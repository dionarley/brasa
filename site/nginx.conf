# Site estático do Docusaurus (build/) servido pelo nginx.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/html
        text/javascript
        text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Docusaurus gera arquivos com hash em assets/: podem ir para o cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # O LICENSE (texto da raiz, copiado no build) é texto puro, sem extensão.
    location = /LICENSE {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
}
