# Visualizador DXF do Brasa servido pelo nginx: dist/ gerado pelo vite e
# drawings/ (os DXF publicados pelo cad_viewer.sh) montado em /srv/drawings.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/html
        text/javascript
        text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Desenhos publicados. Fica fora de html/ para não depender de bind mount
    # aninhado (o dist/ é substituído a cada build).
    location /drawings/ {
        alias /srv/drawings/;
        default_type application/dxf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Assets com hash do vite: cache imutável.
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
