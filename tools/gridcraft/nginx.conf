# GridCraft servido como site estático pelo nginx.
#
# Regras que o pacote web do GridCraft pede (packaging/web/README.md do
# repositório): .wasm como application/wasm, gzip em wasm/js/html, cache
# imutável nos arquivos com hash e index.html sempre revalidado. Não usa
# SharedArrayBuffer, então não precisa de COOP/COEP.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/wasm
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/html
        text/javascript
        text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(js|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
